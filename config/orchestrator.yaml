# Orchestrator control-plane defaults

confirm_before_dispatch: true

# Default executor id (must exist in executors.yaml)
default_executor: mock

# When true, dispatch creates a git worktree under runs/<id>/worktree
use_worktree: true

# Relative path used as the default workspace for demos
default_workspace: playground

gates:
  require_confirm:
    - destructive_shell
    - mass_delete

# Commands Codex / review skill may run for acceptance
acceptance:
  commands:
    - "test -f playground/hello.txt"
    - "grep -q 'Hello' playground/hello.txt || true"

# Future remote probe (not implemented in v1)
ssh_remote:
  enabled: false
  host: ymy@162.105.87.147
  note: "Phase 2 adapter; local OpenCode is primary for v1"
